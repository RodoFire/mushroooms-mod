plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            data()
        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'

    compileOnly "maven.modrinth:ewc:${project.ewc_version}+1.21.1-neoforge"
    implementation "maven.modrinth:ewc:${project.ewc_version}+1.21.1-neoforge"
    runtimeOnly "maven.modrinth:ewc:${project.ewc_version}+1.21.1-neoforge"
    compileOnly "software.bernie.geckolib:geckolib-neoforge-1.21:${project.geckolib_version}"
    implementation "software.bernie.geckolib:geckolib-neoforge-1.21:${project.geckolib_version}"
    runtimeOnly "software.bernie.geckolib:geckolib-neoforge-1.21:${project.geckolib_version}"
    compileOnly "com.github.glitchfiend:TerraBlender-neoforge:1.21-${project.terrablender_version}"
    implementation "com.github.glitchfiend:TerraBlender-neoforge:1.21-${project.terrablender_version}"
    runtimeOnly "com.github.glitchfiend:TerraBlender-neoforge:1.21-${project.terrablender_version}"
}

repositories {
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
    maven { url = 'https://maven.minecraftforge.net/' }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

sourceSets {
    main {
        resources {
            srcDirs += [
                    'src/main/generated'
            ]
        }
    }
}


sourceSets.main.resources { srcDir 'src/generated/resources' }